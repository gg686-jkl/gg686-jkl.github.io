baseURL = 'https://gg686-jkl.github.io/'
locale = 'zh-cn'
title = "Blog"
theme = 'PaperMod'
hasCJKLanguage = true

enableInlineShortcodes = true
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[minify]
  disableXML = false
  minifyOutput = true

[params]
  env = 'production'
  title = "Blog"
  description = "Personal Blog"
  keywords = ["Blog", "Hugo", "PaperMod"]
  author = "gg686-jkl"
  DateFormat = "2006-01-02"
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemenu = false
  showtoc = true
  tocopen = false

  [params.homeInfoParams]
    Title = "Welcome to My Blog 👋"
    Content = "个人笔记、文章与学术思考"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "archives"
    name = "归档"
    url = "/archives/"
    weight = 20
  [[menu.main]]
    identifier = "search"
    name = "搜索"
    url = "/search/"
    weight = 30
  [[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 40
  [[menu.main]]
    identifier = "categories"
    name = "分类"
    url = "/categories/"
    weight = 50
